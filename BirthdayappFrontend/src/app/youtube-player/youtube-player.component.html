<div [id]="playerId" style="width: 100%; height: 360px"></div>

<div class="controls">
  <button class="btn-play" (click)="play()"></button>
  <button class="btn-pause" (click)="pause()"></button>
  <button class="btn-stop" (click)="stop()"></button>
  <button class="btn-prev" (click)="prevVideo()"></button>
  <button class="btn-next" (click)="nextVideo()"></button>
</div>
